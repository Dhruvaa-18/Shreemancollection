<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Admin — Shriman Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">Shriman Admin</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="categories.html">Categories</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="orders.html" class="active">Orders</a>
    <a href="enquiries.html">Enquiries</a>
        <a href="offers.html">Offers</a>
    <a href="../index.html">View Store ↗</a>
    <a href="#" class="logout" id="logoutLink">Log Out</a>
  </aside>

  <main class="admin-main">
    <h1>Orders</h1>
    <div class="admin-panel">
      <table class="admin-table">
        <thead><tr><th>Order ID</th><th>Customer</th><th>Products</th><th>Amount</th><th>Payment</th><th>Status</th></tr></thead>
        <tbody id="orderTable"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script>
  if (!Store.isAdminLoggedIn()) location.href = "login.html";
  document.getElementById("logoutLink").addEventListener("click", function (e) {
    e.preventDefault(); Store.setAdminLoggedIn(false); location.href = "login.html";
  });

  function renderOrders() {
    var orders = Store.getOrders();
    document.getElementById("orderTable").innerHTML = orders.map(function (o) {
      var itemNames = o.items.map(function (item) {
        var p = Store.getProduct(item.productId);
        return p ? p.name + " ×" + item.qty : "";
      }).join(", ");
      var options = Store.ORDER_STEPS.map(function (s) {
        return '<option value="' + s + '"' + (s === o.status ? " selected" : "") + '>' + s + '</option>';
      }).join("");
      return (
        '<tr>' +
          '<td>' + o.id + '</td>' +
          '<td>' + o.address.name + '<br><span style="color:var(--muted);font-size:0.78rem;">' + o.address.phone + '</span></td>' +
          '<td style="max-width:220px;">' + itemNames + '</td>' +
          '<td>₹' + o.total.toLocaleString("en-IN") + '</td>' +
          '<td>' + o.payment + '</td>' +
          '<td><select data-order="' + o.id + '">' + options + '</select></td>' +
        '</tr>'
      );
    }).join("") || '<tr><td colspan="6" style="color:var(--muted);">No orders yet.</td></tr>';

    document.querySelectorAll("[data-order]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        Store.updateOrderStatus(sel.dataset.order, sel.value);
      });
    });
  }
  renderOrders();
</script>
</body>
</html>
